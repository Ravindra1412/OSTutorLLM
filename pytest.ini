[pytest]
; Part 3.11, Section 3 — Testing Environment configuration.
; Markers let `pytest -m <marker>` run one testing "type" from Section 1
; independently (e.g. `pytest -m security`) without reorganizing files
; that already work. Existing pre-3.11 test files are unmarked — they
; predate this convention and are left untouched; every NEW file added
; this phase carries its marker via pytestmark at module level.
markers =
    unit: fast, isolated tests of a single function/class
    integration: tests spanning two or more real modules/tables
    api: tests exercising a real HTTP route via the Flask test client
    frontend: tests validating rendered HTML page structure
    security: adversarial/boundary tests (auth, injection, file upload)
    performance: timing/throughput/concurrency benchmarks (slower; excluded from default -m unit runs)

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Performance tests spin up a real server thread and take longer than
; the rest of the suite combined — excluded from the default run so
; `pytest` stays fast for everyday development; run explicitly via
; `pytest -m performance` or `./run_tests.sh performance`.
addopts = -m "not performance"

; Suppress known external dependency deprecation and version mismatch warnings
filterwarnings =
    ignore::DeprecationWarning:reportlab.*
    ignore:.*urllib3.*or chardet.*doesn't match a supported version.*