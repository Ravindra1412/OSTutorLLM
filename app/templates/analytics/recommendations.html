{% extends "public_base.html" %}
{% block title %}Recommendations{% endblock %}
{% block content %}
<div class="container" style="max-width:820px;">
  <div class="mb-4 d-flex justify-content-between align-items-end flex-wrap gap-2">
    <div>
      <p class="section-eyebrow mb-1">Learning Analytics</p>
      <h4 class="mb-0">Recommended For You</h4>
    </div>
    <button class="btn btn-outline-accent btn-sm" id="regenerate-btn">
      <i class="bi bi-arrow-clockwise"></i> Regenerate
    </button>
  </div>

  <div id="recs-loading" class="text-center py-5">
    <div class="spinner-border text-warning" role="status"></div>
  </div>

  <div id="recs-list" class="d-flex flex-column gap-3 d-none"></div>
  <p class="text-muted-custom small mb-0 d-none" id="recs-empty">
    No recommendations right now — click Regenerate once you've tried a quiz, tutor session, or code review.
  </p>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/analytics_recommendations.js') }}"></script>
{% endblock %}
