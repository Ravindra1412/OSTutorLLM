{% extends "public_base.html" %}
{% block title %}Review Quiz{% endblock %}
{% block content %}
<div class="container" style="max-width:820px;" data-attempt-id="{{ attempt_id }}">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <p class="section-eyebrow mb-1">Review</p>
      <h4 class="mb-0" id="review-topic">Quiz Review</h4>
    </div>
    <a href="/quiz" class="btn btn-outline-accent btn-sm">Back to Dashboard</a>
  </div>

  <div id="review-loading" class="text-center py-5">
    <span class="spinner-dot"></span><span class="spinner-dot"></span><span class="spinner-dot"></span>
  </div>

  <div id="review-content" class="d-none"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/quiz_review.js') }}"></script>
{% endblock %}
