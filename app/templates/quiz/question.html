{% extends "public_base.html" %}
{% block title %}Quiz · {{ topic }}{% endblock %}
{% block content %}
<div class="container" style="max-width:820px;" data-attempt-id="{{ attempt_id }}">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div>
      <p class="section-eyebrow mb-1">Quiz</p>
      <h4 class="mb-0">{{ topic }}</h4>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span class="text-muted-custom small">Question <strong id="q-current">1</strong> of <strong id="q-total">-</strong></span>
      <span class="quiz-timer badge-tier badge-gold" id="timer-badge"><i class="bi bi-clock me-1"></i><span id="quiz-timer">--:--</span></span>
      <button class="btn btn-ghost btn-sm" id="pause-btn" title="Pause timer"><i class="bi bi-pause-fill"></i></button>
    </div>
  </div>

  <div class="quiz-progress-track mb-4" id="quizProgressTrack"></div>

  <div id="loading-state" class="text-center py-5 text-muted-custom">
    <span class="spinner-dot"></span><span class="spinner-dot"></span><span class="spinner-dot"></span>
    <p class="mt-2">Loading quiz...</p>
  </div>

  <div class="card card-elevated d-none" id="quizCard">
    <div class="card-body" id="question-container"></div>
    <div class="card-body border-top border-subtle d-flex justify-content-between">
      <button class="btn btn-ghost" id="prev-btn" disabled><i class="bi bi-arrow-left me-1"></i>Previous</button>
      <button class="btn btn-accent" id="next-btn">Next <i class="bi bi-arrow-right ms-1"></i></button>
      <button class="btn btn-accent d-none" id="submit-btn">Submit Quiz <i class="bi bi-check2 ms-1"></i></button>
    </div>
  </div>

  <div id="submit-error" class="alert d-none mt-3" style="background:var(--bg-elevated);border:1px solid var(--danger);color:var(--text-primary);"></div>
</div>

<!-- Confirm-submit modal -->
<div class="modal fade" id="confirmSubmitModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--bg-elevated);color:var(--text-primary);">
      <div class="modal-header border-subtle">
        <h5 class="modal-title">Submit quiz?</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">You won't be able to change your answers after submitting.</div>
      <div class="modal-footer border-subtle">
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Keep working</button>
        <button type="button" class="btn btn-accent" id="confirm-submit-btn">Submit</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/quiz_engine.js') }}"></script>
{% endblock %}
