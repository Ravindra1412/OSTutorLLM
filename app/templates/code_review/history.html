{% extends "public_base.html" %}
{% block title %}Code Review History{% endblock %}
{% block content %}
<div class="container" style="max-width:820px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <p class="section-eyebrow mb-1">Shell Programming</p>
      <h4 class="mb-0">Review History</h4>
    </div>
    <a href="{{ url_for('code_review_pages_bp.editor') }}" class="btn btn-accent btn-sm"><i class="bi bi-plus-lg me-1"></i>New Review</a>
  </div>

  <div id="history-list">
    <div class="text-center py-5 text-muted-custom">
      <span class="spinner-dot"></span><span class="spinner-dot"></span><span class="spinner-dot"></span>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(async () => {
  const resp = await fetch('/api/code-review/history');
  const body = await resp.json();
  const list = document.getElementById('history-list');
  if (!body.data.length) {
    list.innerHTML = '<div class="card"><div class="card-body text-center text-muted-custom py-5">No code review sessions yet.</div></div>';
    return;
  }
  list.innerHTML = body.data.map(s => `
    <div class="card mb-3">
      <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h6 class="mb-1">${s.topic}</h6>
          <p class="text-muted-custom small mb-0">${s.submission_count} submission(s) · ${new Date(s.created_at).toLocaleDateString()}</p>
        </div>
        <div class="d-flex align-items-center gap-3">
          ${s.latest_score !== null ? `<span class="badge-tier badge-gold">Score: ${s.latest_score}%</span>` : ''}
          <a href="/code-review/session/${s.session_id}" class="btn btn-sm btn-outline-accent">Open</a>
        </div>
      </div>
    </div>
  `).join('');
})();
</script>
{% endblock %}
