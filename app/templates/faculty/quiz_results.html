{% extends "public_base.html" %}
{% block title %}Quiz Results{% endblock %}
{% block content %}
<div class="container" style="max-width:900px;" data-quiz-id="{{ quiz_id }}">
  <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-2">
    <div><p class="section-eyebrow mb-1">Faculty Portal</p><h4 class="mb-0" id="quiz-title">Loading...</h4></div>
    <div class="d-flex gap-2">
      <a href="{{ url_for('faculty_pages_bp.quizzes_page') }}" class="btn btn-outline-accent btn-sm">Back to Quizzes</a>
      <a href="/api/faculty/quizzes/{{ quiz_id }}/results/download?format=csv" class="btn btn-accent btn-sm">Download CSV</a>
      <a href="/api/faculty/quizzes/{{ quiz_id }}/results/download?format=excel" class="btn btn-accent btn-sm">Download Excel</a>
      <a href="/api/faculty/quizzes/{{ quiz_id }}/results/download?format=pdf" class="btn btn-accent btn-sm">Download PDF</a>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-hover">
      <thead><tr><th>Student</th><th>Email</th><th>Score</th><th>Completed At</th></tr></thead>
      <tbody id="results-tbody"></tbody>
    </table>
  </div>
  <p class="text-muted-custom small" id="empty-msg" style="display:none;">No submitted attempts yet.</p>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/faculty_quiz_results.js') }}"></script>
{% endblock %}
