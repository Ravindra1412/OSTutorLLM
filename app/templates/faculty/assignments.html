{% extends "public_base.html" %}
{% block title %}Assignments{% endblock %}
{% block content %}
<div class="container" style="max-width:1000px;">
  <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-2">
    <div><p class="section-eyebrow mb-1">Faculty Portal</p><h4 class="mb-0">Assignments</h4></div>
    <div class="d-flex gap-2">
      <a href="{{ url_for('faculty_pages_bp.dashboard_page') }}" class="btn btn-outline-accent btn-sm">Back to Dashboard</a>
      <button class="btn btn-accent btn-sm" data-bs-toggle="modal" data-bs-target="#assignment-modal">+ New Assignment</button>
    </div>
  </div>

  <div id="assignments-list"></div>
</div>

<div class="modal fade" id="assignment-modal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">New Assignment</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-2"><label class="form-label">Title</label><input class="form-control" id="a-title"></div>
      <div class="mb-2"><label class="form-label">Topic</label><select class="form-select" id="a-topic"></select></div>
      <div class="mb-2"><label class="form-label">Description</label><textarea class="form-control" id="a-description" rows="3"></textarea></div>
      <div class="row g-2">
        <div class="col-6"><label class="form-label">Due Date/Time</label><input type="datetime-local" class="form-control" id="a-due"></div>
        <div class="col-6"><label class="form-label">Max Score</label><input type="number" class="form-control" id="a-max-score" value="100"></div>
      </div>
      <div class="form-check mt-2"><input class="form-check-input" type="checkbox" id="a-allow-late" checked><label class="form-check-label small">Allow late submission</label></div>
      <div class="form-check"><input class="form-check-input" type="checkbox" id="a-publish"><label class="form-check-label small">Publish immediately</label></div>
    </div>
    <div class="modal-footer"><button class="btn btn-accent" id="save-assignment-btn">Create</button></div>
  </div></div>
</div>

<div class="modal fade" id="submissions-modal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Submissions</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="submissions-body"></div>
  </div></div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/faculty_assignments.js') }}"></script>
{% endblock %}
