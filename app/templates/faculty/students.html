{% extends "public_base.html" %}
{% block title %}Students{% endblock %}
{% block content %}
<div class="container" style="max-width:1000px;">
  <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-2">
    <div><p class="section-eyebrow mb-1">Faculty Portal</p><h4 class="mb-0">Students</h4></div>
    <a href="{{ url_for('faculty_pages_bp.dashboard_page') }}" class="btn btn-outline-accent btn-sm">Back to Dashboard</a>
  </div>

  <div class="d-flex gap-2 mb-3">
    <input type="text" class="form-control" id="search-input" placeholder="Search by name or email...">
    <div class="form-check d-flex align-items-center gap-2 ps-3">
      <input class="form-check-input" type="checkbox" id="active-only-check">
      <label class="form-check-label small" for="active-only-check">Active only (7d)</label>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-hover">
      <thead><tr><th>Name</th><th>Email</th><th>Level</th><th>XP</th><th>Overall Score</th><th>Last Login</th><th></th></tr></thead>
      <tbody id="students-tbody"></tbody>
    </table>
  </div>
  <p class="text-muted-custom small" id="empty-msg" style="display:none;">No students found.</p>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/faculty_students.js') }}"></script>
{% endblock %}
